<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Invaders Touch</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  touch-action: none;
}

canvas {
  display: block;
  background: black;
}

#controls {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 35%;
  display: flex;
}

.zone {
  width: 40%;
}

#fire {
  width: 20%;
  background: red;
  color: white;
  font-size: 20px;
  border: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="controls">
  <div class="zone" id="left"></div>
  <button id="fire">FIRE</button>
  <div class="zone" id="right"></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight * 0.65;

// PLAYER
const player = {
  x: canvas.width / 2 - 25,
  y: canvas.height - 40,
  w: 50,
  h: 20,
  speed: 6
};

// BULLETS
let bullets = [];

// ENEMIES
let enemies = [];
for (let i = 0; i < 6; i++) {
  enemies.push({
    x: 80 + i * 90,
    y: 40,
    w: 40,
    h: 25,
    dx: 2
  });
}

let score = 0;
let left = false;
let right = false;

// TOUCH CONTROLS
document.getElementById("left").addEventListener("touchstart", () => left = true);
document.getElementById("left").addEventListener("touchend", () => left = false);

document.getElementById("right").addEventListener("touchstart", () => right = true);
document.getElementById("right").addEventListener("touchend", () => right = false);

document.getElementById("fire").addEventListener("touchstart", shoot);

function shoot() {
  bullets.push({
    x: player.x + player.w / 2 - 3,
    y: player.y,
    w: 6,
    h: 14
  });
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Player movement
  if (left && player.x > 0) player.x -= player.speed;
  if (right && player.x + player.w < canvas.width) player.x += player.speed;

  // Bullets
  bullets.forEach(b => b.y -= 8);
  bullets = bullets.filter(b => b.y > 0);

  // Enemies movement
  let edge = false;
  enemies.forEach(e => {
    e.x += e.dx;
    if (e.x <= 0 || e.x + e.w >= canvas.width) edge = true;
  });

  if (edge) {
    enemies.forEach(e => {
      e.dx *= -1;
      e.y += 20;
    });
  }

  // Collisions
  bullets.forEach((b, bi) => {
    enemies.forEach((e, ei) => {
      if (
        b.x < e.x + e.w &&
        b.x + b.w > e.x &&
        b.y < e.y + e.h &&
        b.y + b.h > e.y
      ) {
        bullets.splice(bi, 1);
        enemies.splice(ei, 1);
        score++;
      }
    });
  });

  // Draw
  ctx.fillStyle = "white";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = "red";
  enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));

  ctx.fillStyle = "white";
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 20, 30);

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
